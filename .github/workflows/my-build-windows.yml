name: my-build-windows

on:
  push:
    tags: ["my-win-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (pi-windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-05
          targets: x86_64-pc-windows-msvc

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure we are on custom and up to date before bumping
          git fetch origin custom 2>$null
          $onCustom = (git branch --show-current) -eq "custom"
          if (-not $onCustom) {
            git checkout custom 2>$null
            if ($LASTEXITCODE -ne 0) { git checkout -b custom origin/custom }
          }
          git pull --rebase origin custom 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Warning "git pull --rebase failed, continuing with local head" }
          cargo install cargo-edit --locked --quiet
          if ($LASTEXITCODE -ne 0) { throw "cargo install cargo-edit failed" }
          cargo set-version --bump patch -p pi_agent_rust
          if ($LASTEXITCODE -ne 0) { throw "cargo set-version failed" }
          $v = (Select-String '^version = "([^"]+)"' Cargo.toml | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          if (-not $v) { throw "Failed to parse bumped version from Cargo.toml" }
          Write-Host "Bumped to $v"
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No version change to commit"
            exit 0
          }
          git commit -m "chore: bump version to $v [skip ci]"
          git pull --rebase origin custom 2>$null
          git push origin HEAD:custom
          Write-Host "Pushed bump $v to origin/custom"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: my-build-windows-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          shared-key: my-build-windows-x86_64-pc-windows-msvc

      - name: Build release-max (windows, native MSVC)
        shell: pwsh
        run: cargo build --profile release-max --locked --bin pi --target x86_64-pc-windows-msvc

      - name: Verify binary exists
        shell: pwsh
        run: |
          Get-ChildItem target/x86_64-pc-windows-msvc/release-max/pi.exe -Force | Format-List Name, Length, LastWriteTime
          Get-Item target/x86_64-pc-windows-msvc/release-max/pi.exe | ForEach-Object { "{0:N2} MB" -f ($_.Length / 1MB) }
          & target/x86_64-pc-windows-msvc/release-max/pi.exe --version

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release-max/pi.exe dist/pi.exe -Force
          Get-ChildItem dist | Format-Table Name, Length
          Get-ChildItem dist | ForEach-Object { "{0} {1:N2} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-windows-amd64
          path: dist/*
          if-no-files-found: error
