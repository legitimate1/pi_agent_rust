name: my-build-windows

on:
  push:
    tags: ["my-win-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (pi-windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-05
          targets: x86_64-pc-windows-msvc

      # NOTE: A 方案：Cargo.toml 即构建版本；云端/部署脚本均只读不 bump，版本递增由本地 bump-and-build.ps1 显式完成。

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: my-build-windows-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          shared-key: my-build-windows-x86_64-pc-windows-msvc

      - name: Build release-max (windows, native MSVC)
        shell: pwsh
        run: cargo build --profile release-max --locked --bin pi --target x86_64-pc-windows-msvc

      - name: Verify binary exists
        shell: pwsh
        run: |
          Get-ChildItem target/x86_64-pc-windows-msvc/release-max/pi.exe -Force | Format-List Name, Length, LastWriteTime
          Get-Item target/x86_64-pc-windows-msvc/release-max/pi.exe | ForEach-Object { "{0:N2} MB" -f ($_.Length / 1MB) }
          & target/x86_64-pc-windows-msvc/release-max/pi.exe --version

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release-max/pi.exe dist/pi.exe -Force
          Get-ChildItem dist | Format-Table Name, Length
          Get-ChildItem dist | ForEach-Object { "{0} {1:N2} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-windows-amd64
          path: dist/*
          if-no-files-found: error
