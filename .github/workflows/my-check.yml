name: my-check

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom, main]
  workflow_dispatch:

concurrency:
  group: my-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/4", "2/4", "3/4", "4/4"]
    runs-on: ubuntu-latest
    env:
      CI: "true"
      VCR_MODE: "playback"
      VCR_CASSETTE_DIR: "tests/fixtures/vcr"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      # Disable sccache wrapper in CI (it's set in .cargo/config.toml for local Windows builds)
      RUSTC_WRAPPER: ""
      SCCACHE_ERROR_LOG: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (fd, rg, xcb)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Prepare check log
        run: rm -f /tmp/check.log; touch /tmp/check.log

      - name: cargo fmt (partition ${{ matrix.partition }})
        if: matrix.partition == '1/4'
        run: cargo fmt --check 2>&1 | tee -a /tmp/check.log; test ${PIPESTATUS[0]} -eq 0

      - name: cargo clippy (partition ${{ matrix.partition }})
        if: matrix.partition == '1/4'
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee -a /tmp/check.log; test ${PIPESTATUS[0]} -eq 0

      - name: cargo test (nextest, partition ${{ matrix.partition }})
        run: cargo nextest run --locked --all-targets --partition count:${{ matrix.partition }} 2>&1 | tee -a /tmp/check.log; test ${PIPESTATUS[0]} -eq 0

      - name: Prepare artifact name
        if: failure()
        run: echo "PART_SAFE=$(echo '${{ matrix.partition }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ env.PART_SAFE }}
          path: /tmp/check.log
          retention-days: 2
          if-no-files-found: warn

  # 回联到本地 pidian（Watchdog×pi-tag）：本机 Self-hosted Runner 直写 C:\Users\m\.pi\tasks.db
  # C 方案直达：从 commit Trailer 提取 Pidian-Tab → labels 透传；failure 错误摘要来自 Artifacts 直传（同 Run 内 check → notify，不经 gh run view）
  notify:
    needs: check
    if: ${{ always() }}
    runs-on: self-hosted
    steps:
      - name: Checkout (for commit trailer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download failure logs
        if: ${{ needs.check.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          pattern: failure-*
          path: ./failures
          merge-multiple: true
        continue-on-error: true

      - name: Notify Agent
        if: ${{ always() }}
        shell: pwsh
        run: |
          # NOTE: git log 在 pwsh 会按行拆成数组，必须 Out-String 后再正则（否则 Cannot index into a null array）
          $raw = (git log -1 --format=%B 2>&1 | Out-String)
          if (-not $raw) { $raw = "" }
          $pidianTab = $null
          $m = [regex]::Match($raw, "^Pidian-Tab:\s*([A-Za-z0-9_\-]+)", [System.Text.RegularExpressions.RegexOptions]::Multiline)
          if ($m.Success) { $pidianTab = $m.Groups[1].Value.Trim() }
          $labels = "notify,ci"
          if ($pidianTab) { $labels += ",pidian-tab:$pidianTab" }
          Write-Host "commit msg trailer: pidianTab=$pidianTab labels=$labels"

          $repo = "${{ github.repository }}" -replace "[*_`#]","\$0"
          $wf = "${{ github.workflow }}" -replace "[*_`#]","\$0"
          $shaFull = "${{ github.sha }}"
          $sha = if ($shaFull.Length -ge 7) { $shaFull.Substring(0,7) } else { $shaFull }
          if ($sha -notmatch "^[0-9a-f]{7}$") { $sha = "unknown" }

          $result = "${{ needs.check.result }}"
          if ([string]::IsNullOrWhiteSpace($result)) { $result = "unknown" }

          @"
          **仓库**: $repo
          **工作流**: $wf
          **Commit**: $sha
          **结果**: $result
          **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content body.md -Encoding utf8

          # failure 时错误摘要来自 Artifacts（check 侧 tee + upload），同 Run 内直传，不调 gh run view（同 Run 内拉日志永远 in_progress 占位）
          if ($result -eq "failure") {
            $errText = ""
            if (Test-Path ./failures) {
              $files = Get-ChildItem ./failures -Recurse -File | Sort-Object FullName
              $all = @()
              foreach ($f in $files) {
                $all += "── $($f.Directory.Name)/$($f.Name) ──"
                $rawLines = Get-Content $f.FullName -ErrorAction SilentlyContinue | ForEach-Object { $_ -replace "\x1b\[[0-9;]*m","" }
                $filtered = $rawLines `
                  | Where-Object { $_ -notmatch "^\s*(Downloading|Downloaded|Compiling|Checking|Updating crates|Updating index|Finished|Blocking waiting|Fresh |Adding )" } `
                  | Where-Object { $_ -match "(?i)(error\[|error:|FAILED|failures:|panicked|assertion failed|test result:|thread .* panicked|warning:|Diff |  left:| right:|expected|found)" } `
                  | Select-Object -Last 50
                if (-not $filtered -or $filtered.Count -eq 0) {
                  $filtered = $rawLines | Where-Object { $_ -notmatch "^\s*(Downloading|Downloaded|Compiling)" -and $_.Trim() -ne "" } | Select-Object -Last 40
                }
                $all += $filtered
                $all += ""
              }
              $errText = ($all -join "`n").Trim()
              if ($errText.Length -gt 4000) { $errText = $errText.Substring($errText.Length - 4000) }
              # 脱敏（token/password 等），与旧逻辑保持一致
              $errText = $errText -replace "(?i)(token|password|secret|key)\s*[:=]\s*\S+","`$1=***"
            }
            "" | Add-Content body.md
            "--- 错误摘要（已过滤，完整见 Run 链接） ---" | Add-Content body.md
            if ($errText) { $errText | Add-Content body.md } else { "(未捕获到精简日志，详见 Run 链接)" | Add-Content body.md }
          }

          $title = "CI $result`: $repo#$sha"
          if ($title.Length -gt 200) { $title = $title.Substring(0,200) }

          Write-Host "pi-tag task create: title=$title labels=$labels"
          pi-tag task create $title --body-file body.md --project pi_agent_rust --requester github-actions --labels $labels
        env:
          GH_TOKEN: ${{ github.token }}
