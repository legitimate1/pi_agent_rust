[package]
name = "pi-core"
version = "0.1.25"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
futures = "0.3"
memchr = "2.8.0"
asupersync = { version = "0.3.6", default-features = false, features = ["tls-webpki-roots", "test-internals"] }

[dev-dependencies]
proptest = "1"
tempfile = "3.25.0"

[lints.rust]
unsafe_code = "forbid"
