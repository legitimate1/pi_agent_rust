# Platform-specific build configuration.
#
# FreeBSD installs third-party libraries (clang, openssl, sqlite, …) under
# /usr/local via pkg(8). Rustc and pkg-config do not search there by default,
# so we add the prefix to the native-library and pkg-config search paths.
# These settings are inert on Linux/macOS/Windows.

# Release binaries are held to a strict <22 MiB budget. The pinned nightly
# toolchain exposes Cargo's profile-scoped rustflags support, which lets the
# LLVM machine outliner reduce repeated instruction sequences without changing
# dev/test diagnostics or applying flags to non-release builds.
[unstable]
profile-rustflags = true

[profile.release]
rustflags = ["-Z", "threads=4", "-Cllvm-args=-enable-machine-outliner=always"]

[target.'cfg(target_os = "freebsd")']
rustflags = ["-L", "/usr/local/lib"]

[env]
PKG_CONFIG_PATH = { value = "/usr/local/libdata/pkgconfig", force = false }

# Use LLD for faster linking on Windows (MSVC target)
# Scoop installs LLVM to user dir; keep lld-link (not MSVC link.exe) per project config.
[target.x86_64-pc-windows-msvc]
linker = "C:\\Users\\m\\scoop\\apps\\llvm\\current\\bin\\lld-link.exe"
# Raise the main-thread stack to 8 MiB (MSVC default is 1 MiB). Debug builds
# of the CLI regularly exceed 1 MiB on some startup paths (clap-derived parse
# + bubbletea-derived models) and overflow the main thread; release builds
# fit because the optimizer shrinks those frames. 8 MiB is a conservative
# ceiling — the same size Linux/macOS give their main threads.
rustflags = ["-C", "link-arg=/STACK:8388608"]

[build]
rustc-wrapper = "sccache"
# Parallel rustc front-end (nightly). From upstream.
rustflags = ["-Z", "threads=4"]
